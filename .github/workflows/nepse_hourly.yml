name: NEPSE hourly live extract

on:
  schedule:
    # NEPSE ~Sun–Thu 11:00–15:30 NST (UTC+05:45) ≈ 05:15–09:45 UTC
    - cron: "15 5-9 * * 0-4"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  extract-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch NEPSE live data
        env:
          OUTPUT_DIR: output/live
          CI: "true"
        run: python extract/fetch_live.py

      - name: Publish live files to live-data branch
        run: |
          set -euo pipefail
          rm -rf publish && mkdir -p publish/live
          cp output/live/*.xlsx output/live/*.csv output/live/last_success.json publish/live/ 2>/dev/null || true
          cd publish
          git init
          git checkout -b live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "NEPSE live refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nepse-live-${{ github.run_id }}
          path: output/live/
          retention-days: 7
